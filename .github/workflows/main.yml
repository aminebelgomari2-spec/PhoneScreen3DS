name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          apt-get update
          apt-get install -y wget unzip qrencode
          dkp-pacman -Sy --noconfirm --needed 3ds-libjpeg-turbo

          wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -j bannertool.zip "linux-x86_64/bannertool" -d /opt/devkitpro/tools/bin

          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          unzip -o makerom-v0.18-ubuntu_x86_64.zip makerom -d /opt/devkitpro/tools/bin
          chmod a+x /opt/devkitpro/tools/bin/makerom /opt/devkitpro/tools/bin/bannertool

      - name: Compiler le .3dsx
        run: make

      - name: Generer le .cia
        run: make cia

      - name: Generer le QR code du .cia
        run: |
          qrencode -s 8 -o PhoneScreen3DS-qr.png \
            "https://github.com/${{ github.repository }}/releases/download/latest/PhoneScreen3DS.cia"

      - name: Garder les fichiers en artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneScreen3DS
          path: |
            PhoneScreen3DS.3dsx
            PhoneScreen3DS.cia
            PhoneScreen3DS-qr.png

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PhoneScreen 3DS (derniere version)
          files: |
            PhoneScreen3DS.3dsx
            PhoneScreen3DS.cia
            PhoneScreen3DS-qr.png
